name: 'Repository Hygiene'

'on':
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'
      - 'ready_for_review'

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  repository-hygiene:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@870429202376dac2e9434746941c54f9a2be605f' # v0.33.0
